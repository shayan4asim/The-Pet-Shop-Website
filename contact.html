<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - THE PETS SHOP</title>
    <meta name="description"
        content="Visit The Pets Shop in Victorville, CA. Get directions, store hours, and contact information.">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <section class="section-padding text-center" style="background-color: var(--bg-light);">
        <div class="container">
            <h1>Contact & Location</h1>
            <p>We'd love to see you!</p>
        </div>
    </section>

    <section class="section-padding">
        <div class="container grid grid-cols-2 gap-lg items-start">
            <div>
                <div class="card" style="padding: 2rem; margin-bottom: 2rem;">
                    <h3>📍 Address</h3>
                    <p style="font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--text-muted);">
                        15323 7th St,<br>
                        Victorville, CA 92395,<br>
                        United States
                    </p>
                    <a href="https://www.google.com/maps/dir//15323+7th+St,+Victorville,+CA+92395" target="_blank"
                        class="btn btn-primary" style="margin-top: 1rem;">Get Directions</a>
                </div>

                <div class="card" style="padding: 2rem; margin-bottom: 2rem;">
                    <h3>📞 Phone</h3>
                    <p style="font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--primary); font-weight: 600;">
                        <a href="tel:+17605524028">+1 760-552-4028</a>
                    </p>
                    <p style="color: var(--text-muted);">Call us for questions about stock or specific pets.</p>
                </div>

                <div class="card" style="padding: 2rem;">
                    <h3>🕒 Hours</h3>
                    <ul style="color: var(--text-muted); margin-top: 0.5rem;">
                        <li class="flex justify-between" style="border-bottom: 1px solid #eee; padding: 0.5rem 0;">
                            <span>Monday - Sunday</span>
                            <strong>Opens at 11:00 AM</strong>
                        </li>
                    </ul>
                    <p style="font-size: 0.9rem; margin-top: 1rem; color: var(--accent-orange);">* Holiday hours (like
                        Christmas Eve) may vary.</p>
                </div>
            </div>

            <div
                style="height: 100%; min-height: 500px; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-md);">
                <!-- Embedded Google Map -->
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3294.6293992683057!2d-117.294156!3d34.520444!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80c367a74653dc37%3A0xe53480088267ab67!2s15323%207th%20St%2C%20Victorville%2C%20CA%2092395!5e0!3m2!1sen!2sus!4v1703429399268!5m2!1sen!2sus"
                    width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy">
                </iframe>
            </div>
        </div>
    </section>

    <script src="js/main.js"></script>

</html>
